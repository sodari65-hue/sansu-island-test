<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラ プレビュー</title>
<style>
  body{margin:0;font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#e7f4ff;color:#16324a}
  .wrap{display:grid;grid-template-columns:1fr 320px;height:100vh}
  #cv{width:100%;height:100%;display:block;touch-action:none;background:#bfe6ff}
  aside{padding:14px;overflow:auto;background:#fff;border-left:1px solid #cfe4f4}
  h1{font-size:17px;margin:0 0 4px} p{font-size:12.5px;color:#5c748c;margin:0 0 10px;line-height:1.7}
  h2{font-size:13px;margin:14px 0 6px;color:#10699f}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-weight:700;border:2px solid #cfe4f4;background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
  button.on{background:#1b8ed6;color:#fff;border-color:#10699f}
  .sw{width:34px;height:34px;padding:0;border-radius:50%}
  #info{font-size:12px;color:#5c748c;margin-top:12px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv"></canvas>
  <aside>
    <h1>キャラ プレビュー</h1>
    <p>character/config/character.json と textures/faces.png から組み立てています。原画と見くらべて、数値を直して再読みこみしてください。画面をなぞると回ります。</p>
    <h2>ぼうし</h2><div class="row" id="hats"></div>
    <h2>かお（いつもの顔）</h2><div class="row" id="faces"></div>
    <h2>うごき</h2><div class="row" id="anims"></div>
    <h2>もちもの</h2><div class="row" id="items"></div>
    <div id="info"></div>
  </aside>
</div>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import { loadCharacter, createCharacter } from '../src/character.js';
import { createItemFactory } from '../src/items.js';

const itemsCfg = await (await fetch('../config/items.json')).json();
const grades = (await (await fetch('../data/grades.json')).json()).grades;
const g5 = grades.find(g => g.grade === 5).color;
const DEMO = [
  { id: 'item_acorn', model: 'acorn', color: '#a8743f', pattern: 'plain' },
  ...['tool_A','tool_B','tool_C','tool_D'].map((m, i) => ({ id: m, model: m, color: g5, pattern: ['plain','stripe','sparkle','dots'][i] })),
  ...['acc_A','acc_B','acc_C','acc_D'].map((m, i) => ({ id: m, model: m, color: g5, pattern: ['q1','q2','q3','q4'][i] })),
  { id: 'crown', model: 'crown', color: '#f2c94c', pattern: 'sparkle' },
];

// preview.html は character/ の下にあるので、相対パスを1つ上に合わせる
const origFetch = window.fetch;
window.fetch = (u, o) => origFetch(typeof u === 'string' && u.startsWith('./') ? '../' + u.slice(2) : u, o);
const origLoad = THREE.TextureLoader.prototype.load;
THREE.TextureLoader.prototype.load = function(u, ...a){ return origLoad.call(this, u.startsWith('./') ? '../' + u.slice(2) : u, ...a); };

const cfg = await loadCharacter(THREE);
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6ff);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9ab89a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(2, 4, 3); scene.add(sun);
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
cam.position.set(0, 1.5, 5.2); cam.lookAt(0, 1.1, 0);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1.6, 32), new THREE.MeshLambertMaterial({ color: 0x8fd18a }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

const makeItem = createItemFactory(THREE, id => DEMO.find(d => d.id === id));
const ch = createCharacter(THREE, { makeItem });
scene.add(ch.root);
ch.setItem('item_acorn');

const btn = (parent, label, on, cls = '') => { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.onclick = () => { [...parent.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); on(); }; parent.append(b); return b; };
const strip = t => t.replace(/\{([^{}|]+)\|[^{}|]+\}/g, '$1');
for (const h of cfg.hatColors){ const b = btn(document.getElementById('hats'), '', () => ch.setHatColor(h.id), 'sw'); b.style.background = h.color; b.title = strip(h.name); }
for (const f of cfg.faces) btn(document.getElementById('faces'), f.name, () => ch.setFace(f.id));
for (const a of Object.keys(cfg.animations)) btn(document.getElementById('anims'), a, () => { walking = a === 'walk'; if (!cfg.animations[a].loop) ch.play(a); });
for (const d of DEMO) btn(document.getElementById('items'), itemsCfg.modelNames[d.model], () => ch.setItem(d.id));

let walking = false, yaw = 0.35, drag = null;
canvas.addEventListener('pointerdown', e => { drag = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (drag != null){ yaw += (e.clientX - drag) * 0.01; drag = e.clientX; } });
canvas.addEventListener('pointerup', () => drag = null);

function resize(){ const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ch.update(dt, { moving: walking });
  ch.root.rotation.y = yaw;
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);
window.PREVIEW = { ch, renderer, scene, cam, step(dt){ ch.update(dt, { moving: walking }); ch.root.rotation.y = yaw; renderer.render(scene, cam); } };
document.getElementById('info').innerHTML =
  `キャラの三角形：<b>${Math.round(ch.triangles())}</b>（めやす 5,000 以下／輪郭線こみ）<br>高さ：${ch.height.toFixed(2)}`;
</script>
</body>
</html>
